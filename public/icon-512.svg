<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Central Glowing WhatsApp Message Bubble & PDF Badge -->
  <g filter="url(#glow)">
    <!-- WhatsApp Message Bubble Base -->
    <path d="M256 100 C162.1 100 86 176.1 86 270 C86 303.4 95.8 334.6 112.7 360.8 L92 426 L160.4 406.2 C188.3 423.8 221 434 256 434 C349.9 434 426 357.9 426 264 C426 170.1 349.9 100 256 100 Z" fill="url(#emerald-grad)"/>
  </g>
  
  <!-- PDF & Document Emblem in center -->
  <g transform="translate(196, 175)">
    <!-- PDF Document Card -->
    <rect x="0" y="0" width="120" height="150" rx="14" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))"/>
    <!-- Folded Corner -->
    <path d="M85 0 L120 35 L85 35 Z" fill="#cbd5e1"/>
    <!-- Document Lines -->
    <rect x="20" y="55" width="80" height="8" rx="4" fill="#059669"/>
    <rect x="20" y="73" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="20" y="91" width="75" height="8" rx="4" fill="#94a3b8"/>
    <!-- PDF Pill Badge -->
    <rect x="18" y="112" width="48" height="22" rx="6" fill="#dc2626"/>
    <text x="42" y="127" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" text-anchor="middle">PDF</text>
  </g>
</svg>
