<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing Header Badge -->
  <g transform="translate(80, 80)">
    <rect width="360" height="40" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="24" cy="20" r="6" fill="#10b981"/>
    <text x="42" y="25" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">META CLOUD API • PERSISTENT HUB</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
    WhatsApp Communication
  </text>
  <text x="80" y="255" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
    Platform & PDF Blast
  </text>

  <!-- Subtitle -->
  <text x="80" y="320" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22">
    One-Command PDF Distribution • Real-time Delivery Status • Secure Admin Mode
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(80, 390)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="220" height="70" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="14">ONE-COMMAND BLAST</text>
    <text x="24" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">PDF & Text Distribution</text>

    <!-- Chip 2 -->
    <rect x="240" y="0" width="220" height="70" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="264" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">REAL-TIME TRACKING</text>
    <text x="264" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">Sent, Delivered, Read</text>

    <!-- Chip 3 -->
    <rect x="480" y="0" width="220" height="70" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="504" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="14">SECURITY & CLOUD</text>
    <text x="504" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">PIN Auth & Firebase</text>
  </g>

  <!-- Right Visual Illustration Badge -->
  <g transform="translate(820, 140)" filter="url(#og-glow)">
    <!-- Big WhatsApp Circle Base -->
    <circle cx="160" cy="160" r="140" fill="url(#og-accent)"/>
    <!-- Central Document -->
    <rect x="105" y="85" width="110" height="150" rx="14" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))"/>
    <path d="M180 85 L215 120 L180 120 Z" fill="#cbd5e1"/>
    <rect x="120" y="135" width="80" height="8" rx="4" fill="#059669"/>
    <rect x="120" y="153" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="120" y="171" width="75" height="8" rx="4" fill="#94a3b8"/>
    <rect x="120" y="195" width="45" height="22" rx="6" fill="#dc2626"/>
    <text x="142" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">PDF</text>
  </g>

  <!-- Footer branding -->
  <text x="80" y="570" fill="#64748b" font-family="system-ui, sans-serif" font-weight="500" font-size="16">
    Meta WhatsApp Cloud API v21.0 • Progressive Web Application (PWA) • Firebase Cloud Storage
  </text>
</svg>
